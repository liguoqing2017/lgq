<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo - Spring Boot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        .icon { font-size: 60px; margin-bottom: 16px; }
        h1 { color: #333; margin-bottom: 12px; font-size: 28px; }
        .version { color: #999; font-size: 14px; margin-bottom: 24px; }
        .status {
            display: inline-block;
            background: #e8f5e9;
            color: #2e7d32;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .endpoint-list { text-align: left; }
        .endpoint-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .method {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            color: white;
        }
        .method.get { background: #4caf50; }
        .endpoint-url {
            font-family: 'Courier New', monospace;
            color: #555;
            font-size: 14px;
        }
        .section-title {
            color: #666;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🚀</div>
        <h1>Demo</h1>
        <p class="version">Spring Boot 4.1.0 | Java 25</p>
        <div class="status">● 服务运行中</div>

        <div class="endpoint-list">
            <div class="section-title">API 接口</div>
            <div class="endpoint-item">
                <span class="method get">GET</span>
                <span class="endpoint-url">/api/hello</span>
            </div>
            <div class="endpoint-item">
                <span class="method get">GET</span>
                <span class="endpoint-url">/api/hello?name=YourName</span>
            </div>
            <div class="endpoint-item">
                <span class="method get">GET</span>
                <span class="endpoint-url">/api/info</span>
            </div>
            <div class="endpoint-item">
                <span class="method get">GET</span>
                <span class="endpoint-url">/actuator/health</span>
            </div>
        </div>
    </div>
</body>
</html>
